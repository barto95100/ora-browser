name: Lint and Formatting

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: macos-latest
    
    steps:
    - name: Check architecture
      run: uname -m
      
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: Show Swift version
      run: swift --version

    - name: Install Xcodegen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: swiftlint lint

    - name: Install SwiftFormat (version figée)
      env:
        SWIFTFORMAT_VERSION: "0.64.1"
      run: |
        curl -fsSL -o /tmp/swiftformat.zip \
          "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
        mkdir -p "$RUNNER_TEMP/swiftformat-bin"
        unzip -o -q /tmp/swiftformat.zip -d "$RUNNER_TEMP/swiftformat-bin"
        chmod +x "$RUNNER_TEMP/swiftformat-bin/swiftformat"
        echo "$RUNNER_TEMP/swiftformat-bin" >> "$GITHUB_PATH"

    - name: Check code formatting
      run: |
        which swiftformat
        swiftformat --version
        swiftformat --lint .

    - name: Install Xcbeautify
      run: brew install xcbeautify

    - name: Clean build folder
      run: xcodebuild clean -scheme ora -project Ora.xcodeproj
    
    - name: Cache SPM dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm/
          ~/.swiftpm/
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-spm-
    
    - name: Resolve dependencies
      run: xcodebuild -resolvePackageDependencies
