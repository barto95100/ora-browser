# Lint, format check, build and unit tests on every push and pull request,
# also runnable on demand.
#
# It runs on the maintainer's own Mac (a self-hosted runner): GitHub's macOS
# runners often left it queued for hours. Run it on demand with runner
# "github" to check a clean machine, before each distributed version.
# Pull requests from someone else's fork run on GitHub's runners, never on
# the Mac (with "Require approval for all external contributors" set in the
# repository's Actions settings, as a fork could edit this file).
name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      runner:
        description: Where to run
        type: choice
        options: [self-hosted, github]
        default: self-hosted

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same versions as the ones used locally, so lint results match.
  SWIFTLINT_VERSION: "0.65.1"
  SWIFTFORMAT_VERSION: "0.64.1"

jobs:
  build-and-test:
    # GitHub's runner when asked, or for a pull request from someone else's
    # fork (it would run their code on the Mac); the Mac otherwise.
    runs-on: >-
      ${{ fromJSON((inputs.runner == 'github' || (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository))
      && '"macos-latest"' || '["self-hosted", "macOS", "ARM64"]') }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The self-hosted Mac keeps its own Xcode: switching it needs sudo.
      - name: Setup Xcode
        if: runner.environment == 'github-hosted'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          uname -m
          xcodebuild -version
          swift --version

      - name: Install pinned SwiftLint and SwiftFormat
        run: |
          bin="$RUNNER_TEMP/tools-bin"
          mkdir -p "$bin"
          # Download a release archive and install the named binary from it,
          # wherever it sits inside the archive. The Mac's own binary instead
          # when it is that very version (GitHub's downloads can fail for a
          # while, with nothing else to fix).
          install_tool() {
            local name="$1" url="$2" version="$3" dir="$RUNNER_TEMP/$1"
            local installed
            installed=$(command -v "$name" || true)
            if [ -n "$installed" ] && [ "$("$installed" --version 2>/dev/null)" = "$version" ]; then
              ln -sf "$installed" "$bin/$name"
              return
            fi
            curl -fsSL --retry 3 -o "$dir.zip" "$url"
            unzip -o -q "$dir.zip" -d "$dir"
            install -m 755 "$(find "$dir" -type f -name "$name" | head -n 1)" "$bin/$name"
          }
          install_tool swiftlint \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" \
            "$SWIFTLINT_VERSION"
          install_tool swiftformat \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" \
            "$SWIFTFORMAT_VERSION"
          echo "$bin" >> "$GITHUB_PATH"

      # The self-hosted Mac uses its own: nothing is installed or upgraded there.
      - name: Install XcodeGen and xcbeautify
        env:
          GITHUB_HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          for tool in xcodegen xcbeautify; do
            if command -v "$tool" >/dev/null; then continue; fi
            if [ "$GITHUB_HOSTED" = true ]; then
              brew install "$tool"
            else
              echo "::error::$tool is missing on this Mac: brew install $tool"
              exit 1
            fi
          done

      - name: Lint
        run: |
          swiftlint version
          swiftlint lint --quiet

      - name: Check formatting
        run: |
          swiftformat --version
          swiftformat --lint .

      - name: Generate Xcode project
        run: xcodegen

      # The self-hosted Mac keeps its packages and builds between runs
      # instead, outside the checkout (which is cleaned each time); one
      # runner only, or two runs would share them.
      - name: Cache Swift packages
        if: runner.environment == 'github-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spm
          key: ${{ runner.os }}-spm-${{ hashFiles('Ombre.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # GitHub's runners have no signing identity: sign ad hoc ("-") there,
      # which is enough to build, run the host app and load the test bundle.
      # The self-hosted Mac signs as usual, like a local `xcodebuild test`
      # (an ad hoc app would ask for its sandbox container there). Its
      # service must not set SessionCreate, or codesign can't reach the
      # login keychain.
      # Packages are the versions pinned in Package.resolved, never newer ones.
      # On the self-hosted Mac, builds and packages (Sparkle's Updater.app) go
      # to .noindex folders: Spotlight skips them, so it never registers these
      # apps again with Launch Services once they are unregistered.
      - name: Build and run unit tests
        env:
          GITHUB_HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -o pipefail
          if [ "$GITHUB_HOSTED" = true ]; then
            places=(-clonedSourcePackagesDirPath .spm)
            signing=(CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="")
          else
            places=(
              -clonedSourcePackagesDirPath "$RUNNER_WORKSPACE/spm.noindex"
              -derivedDataPath "$RUNNER_WORKSPACE/DerivedData.noindex"
            )
            signing=()
          fi
          xcodebuild test \
            -project Ombre.xcodeproj \
            -scheme Ombre \
            -destination "platform=macOS,arch=arm64" \
            "${places[@]}" \
            -disableAutomaticPackageResolution \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            "${signing[@]}" \
            OMBRE_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee "$RUNNER_TEMP/build.log" | xcbeautify --renderer github-actions

      # Warnings stay at 0: the compilers' warnings already fail the build
      # above (OMBRE_WARNINGS_AS_ERRORS); this catches the others (linker,
      # asset catalog, build phases), except the packages' own. Xcode's App Intents
      # step warns on every app without App Intents: not ours.
      - name: Check for warnings
        run: |
          warnings=$(grep -E '(^|[^[:alnum:]])warning: ' "$RUNNER_TEMP/build.log" \
            | grep -v -e appintentsmetadataprocessor -e '/spm.noindex/' -e '/\.spm/' -e '/SourcePackages/' \
            | sort -u || true)
          if [ -n "$warnings" ]; then
            echo "$warnings"
            echo "::error::The build has warnings: fix them (the project keeps 0)."
            exit 1
          fi

      # Every text of the translated zones has its French (scripts/check-localization.py),
      # and the committed catalog lists all the texts of the code (the export
      # adds the new ones to the file; keys compared, not bytes: another Xcode
      # may write the file differently).
      - name: Check translations
        env:
          GITHUB_HOSTED: ${{ runner.environment == 'github-hosted' }}
        run: |
          set -o pipefail
          if [ "$GITHUB_HOSTED" = true ]; then
            derived="$RUNNER_TEMP/LocData.noindex"
            places=(-clonedSourcePackagesDirPath .spm -derivedDataPath "$derived")
            signing=(CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER="")
          else
            derived="$RUNNER_WORKSPACE/DerivedData.noindex"
            places=(-clonedSourcePackagesDirPath "$RUNNER_WORKSPACE/spm.noindex" -derivedDataPath "$derived")
            signing=()
          fi
          committed="$RUNNER_TEMP/committed.xcstrings"
          cp Ombre/Resources/Localizable.xcstrings "$committed"
          xcodebuild -exportLocalizations \
            -project Ombre.xcodeproj \
            -scheme Ombre \
            -localizationPath "$RUNNER_TEMP/Localizations" \
            -exportLanguage fr \
            "${places[@]}" \
            -disableAutomaticPackageResolution \
            "${signing[@]}" \
            -quiet
          python3 -I scripts/check-localization.py "$derived" Ombre/Resources/Localizable.xcstrings \
            --committed "$committed"

      # Otherwise clicking a notification could open one of these copies
      # (the app, the tests' app and Sparkle's Updater.app, in Debug and Test).
      # Written out here, not with scripts/unregister-copies.sh: this runs
      # even when the checkout failed.
      - name: Unregister the built apps
        if: always() && runner.environment == 'self-hosted'
        run: |
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          unregister() {
            find "$RUNNER_WORKSPACE" -type d -name '*.app' -print0 \
              | xargs -0 -n 1 "$lsregister" -u 2>/dev/null || true
            # Copies registered from there, even if since deleted.
            "$lsregister" -dump \
              | awk -v dir="$RUNNER_WORKSPACE/" '/^path:/ { sub(/^path: +/, ""); sub(/ \(0x[0-9a-f]+\)$/, ""); if (index($0, dir) == 1) print }' \
              | sort -u | while IFS= read -r app; do "$lsregister" -u "$app" 2>/dev/null || true; done
          }
          # The tests' app may still be quitting: macOS registered it again
          # right after it was unregistered. Wait for it (30 s at most),
          # then unregister twice, a few seconds apart.
          for _ in $(seq 30); do
            pgrep -f "$RUNNER_WORKSPACE/DerivedData.noindex" >/dev/null || break
            sleep 1
          done
          unregister
          sleep 5
          unregister

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults
          path: ${{ runner.temp }}/TestResults.xcresult
          retention-days: 7
