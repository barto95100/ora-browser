name: Ora
options:
  bundleIdPrefix: com.barto95100

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  Inject:
    url: https://github.com/krzysztofzablocki/Inject
    from: 1.5.2
  FaviconFinder:
    url: https://github.com/will-lumley/FavIconFinder
    exactVersion: 5.1.5
  SafariConverterLib:
    url: https://github.com/AdguardTeam/SafariConverterLib
    exactVersion: 4.2.2
  # Public Suffix List (already used by SafariConverterLib): which domains
  # belong to the same web site.
  swift-psl:
    url: https://github.com/ameshkov/swift-psl
    from: 1.1.0

targets:
  ora:
    type: application
    platform: "macOS"
    deploymentTarget: "15.0"
    sources:
      - path: ora
        excludes:
          - "Assets/Icons/**"
    resources:
      - path: ora/Shared/EmojiPicker/emoji-set.json
      - path: ora/Resources
        optional: true
    dependencies:
      - package: Sparkle
      - package: Inject
      - package: FaviconFinder
      - package: SafariConverterLib
        product: ContentBlockerConverter
      - package: swift-psl
        product: PublicSuffixList

    preBuildScripts:
      - name: "Copy Icon Bundle"
        inputFiles:
          - "$(SRCROOT)/ora/Assets/Icons/OraIcon.icon"
          - "$(SRCROOT)/ora/Assets/Icons/OraIconDev.icon"
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/OraIcon.icon"
          - "$(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/OraIconDev.icon"
        script: |
          ICON_SRC_DEV="$SRCROOT/ora/Assets/Icons/OraIconDev.icon"
          ICON_SRC_RELEASE="$SRCROOT/ora/Assets/Icons/OraIcon.icon"
          ICON_DST="$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/Contents/Resources/"
          if [ "$CONFIGURATION" = "Debug" ]; then
              echo "Using OraIconDev.icon for Debug build"
              cp -R "$ICON_SRC_DEV" "$ICON_DST"
          else
              echo "Using OraIcon.icon for Release build"
              cp -R "$ICON_SRC_RELEASE" "$ICON_DST"
          fi

    info:
      path: ora/Info/Info.plist
      properties:
        # Web pages may load over plain HTTP, like in any browser (WebKit then
        # marks them as not secure); the app's own requests keep App Transport
        # Security. Without it, every public http:// page failed (error -1022).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSCameraUsageDescription: "Allows websites to use the camera, for example during video calls."
        NSMicrophoneUsageDescription: "Allows websites to use the microphone, for example during calls or dictation."
        SUFeedURL: "https://barto95100.github.io/ora-browser/appcast.xml"
        SUPublicEDKey: "Ozj+rezzbJAD76RfajtfQ7rFojJbpFSCl/0DcFSBCTI="
        SUEnableAutomaticChecks: NO
        SUEnableInstallerLauncherService: YES
        CFBundleURLTypes:
          - CFBundleURLName: Ora Browser
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            CFBundleURLSchemes:
              - http
              - https
        CFBundleDocumentTypes:
          - CFBundleTypeName: Web URL
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.url
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.html
          - CFBundleTypeName: XHTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.xhtml
        NSUserActivityTypes:
          - NSUserActivityTypeBrowsingWeb
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.web-browser

    settings:
      base:
        SWIFT_VERSION: 5.9
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.2.14
        CURRENT_PROJECT_VERSION: 105
        PRODUCT_NAME: Ora
        PRODUCT_BUNDLE_IDENTIFIER: com.barto95100.ora
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUFeedURL: "https://barto95100.github.io/ora-browser/appcast.xml"
        SUPublicEDKey: "Ozj+rezzbJAD76RfajtfQ7rFojJbpFSCl/0DcFSBCTI="
        SUEnableAutomaticChecks: NO
        SUEnableInstallerLauncherService: YES
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: OraIconDev
          PRODUCT_BUNDLE_IDENTIFIER: com.barto95100.ora.dev
          CODE_SIGN_ENTITLEMENTS: ora/Info/ora-dev.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          EMIT_FRONTEND_COMMAND_LINES: YES
          OTHER_LDFLAGS: "-Xlinker -interposable"
          ENABLE_HARDENED_RUNTIME: NO
          DEVELOPMENT_TEAM: Q76T6LDBBZ
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: OraIcon
          CODE_SIGN_ENTITLEMENTS: ora/Info/ora.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: 3Y566D2A4G
          PROVISIONING_PROFILE_SPECIFIER: ora-profile-working
          ENABLE_HARDENED_RUNTIME: YES

  oraTests:
    type: bundle.unit-test
    platform: "macOS"
    deploymentTarget: "15.0"
    sources:
      - path: oraTests
    dependencies:
      - target: ora
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ora.app/Contents/MacOS/Ora"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q76T6LDBBZ

schemes:
  ora:
    shared: true
    build:
      targets:
        ora: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - oraTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
