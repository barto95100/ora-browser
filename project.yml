name: Ombre
options:
  bundleIdPrefix: com.barto95100

# "Test": the app the unit tests run in, built like Debug but with its own
# bundle identifier, so its preferences, files and Keychain items never mix
# with the Debug app's (see `TestHost`).
configs:
  Debug: debug
  Test: debug
  Release: release

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  Inject:
    url: https://github.com/krzysztofzablocki/Inject
    from: 1.5.2
  FaviconFinder:
    url: https://github.com/will-lumley/FavIconFinder
    exactVersion: 5.1.5
  SafariConverterLib:
    url: https://github.com/AdguardTeam/SafariConverterLib
    exactVersion: 4.2.2
  # Public Suffix List (already used by SafariConverterLib): which domains
  # belong to the same web site.
  swift-psl:
    url: https://github.com/ameshkov/swift-psl
    from: 1.1.0

targets:
  Ombre:
    type: application
    platform: "macOS"
    deploymentTarget: "15.0"
    sources:
      - path: Ombre
      # Shown in the Licenses window.
      - path: LICENSE
        buildPhase: resources
    resources:
      - path: Ombre/Shared/EmojiPicker/emoji-set.json
      - path: Ombre/Resources
        optional: true
    dependencies:
      - package: Sparkle
      - package: Inject
      - package: FaviconFinder
      - package: SafariConverterLib
        product: ContentBlockerConverter
      - package: swift-psl
        product: PublicSuffixList

    info:
      path: Ombre/Info/Info.plist
      properties:
        # Web pages may load over plain HTTP, like in any browser (WebKit then
        # marks them as not secure); the app's own requests keep App Transport
        # Security. Without it, every public http:// page failed (error -1022).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSCameraUsageDescription: "Allows websites to use the camera, for example during video calls."
        NSMicrophoneUsageDescription: "Allows websites to use the microphone, for example during calls or dictation."
        NSLocationUsageDescription: "Lets websites you approve know your location, for example for maps or nearby stores."
        NSLocationWhenInUseUsageDescription: "Lets websites you approve know your location, for example for maps or nearby stores."
        SUEnableAutomaticChecks: NO
        SUEnableInstallerLauncherService: YES
        # The commit a Release was built from (OMBRE_GIT_COMMIT, set by
        # scripts/build.sh): which version is installed.
        OmbreCommit: $(OMBRE_GIT_COMMIT)
        CFBundleURLTypes:
          - CFBundleURLName: Ombre
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            CFBundleURLSchemes:
              - http
              - https
        CFBundleDocumentTypes:
          - CFBundleTypeName: Web URL
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.url
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.html
          - CFBundleTypeName: XHTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.xhtml
        NSUserActivityTypes:
          - NSUserActivityTypeBrowsingWeb
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.web-browser
        # Read by the string catalog (InfoPlist.xcstrings), which an export or
        # an Xcode build would rewrite with Debug's name: the built app's names
        # come from PRODUCT_NAME instead (INFOPLIST_KEY_CFBundleDisplayName).
        CFBundleDisplayName: Ombre
        CFBundleName: Ombre

    settings:
      base:
        SWIFT_VERSION: 5.9
        # Swift 6's data-race checks, as warnings (the language stays Swift 5):
        # all the code is checked; a new warning is to fix, not to leave.
        SWIFT_STRICT_CONCURRENCY: complete
        # Swift 6's: a key path literal is Sendable when it can be (sort orders).
        SWIFT_UPCOMING_FEATURE_INFER_SENDABLE_FROM_CAPTURES: YES
        # Warnings stay at 0: the CI builds with OMBRE_WARNINGS_AS_ERRORS=YES,
        # so any new one fails it (packages don't read this, only our targets).
        OMBRE_WARNINGS_AS_ERRORS: NO
        SWIFT_TREAT_WARNINGS_AS_ERRORS: $(OMBRE_WARNINGS_AS_ERRORS)
        GCC_TREAT_WARNINGS_AS_ERRORS: $(OMBRE_WARNINGS_AS_ERRORS)
        CODE_SIGN_STYLE: Automatic
        # Set by scripts/build.sh (Info.plist's OmbreCommit).
        OMBRE_GIT_COMMIT: ""
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 106
        PRODUCT_NAME: Ombre
        # Debug's app is "Ombre Dev" (see Debug below); the Swift module stays
        # "Ombre" in every configuration.
        PRODUCT_MODULE_NAME: Ombre
        INFOPLIST_KEY_CFBundleDisplayName: $(PRODUCT_NAME)
        # Interface in the Mac's language (English, French): the compiler
        # lists the strings to translate in Ombre/Resources/Localizable.xcstrings
        # (checked by scripts/check-localization.sh).
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.barto95100.ora
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Icon Composer file: Ombre/Assets/Icons/Ombre.icon (light, dark, mono).
        ASSETCATALOG_COMPILER_APPICON_NAME: Ombre
        SUEnableAutomaticChecks: NO
        SUEnableInstallerLauncherService: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.barto95100.ora.dev
          # Not to be mistaken for the installed Ombre: the Dock, the menu bar
          # and macOS's lists (default browser) show this name.
          PRODUCT_NAME: Ombre Dev
          CODE_SIGN_ENTITLEMENTS: Ombre/Info/Ombre-dev.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          EMIT_FRONTEND_COMMAND_LINES: YES
          OTHER_LDFLAGS: "-Xlinker -interposable"
          ENABLE_HARDENED_RUNTIME: NO
          DEVELOPMENT_TEAM: Q76T6LDBBZ
        Test:
          PRODUCT_BUNDLE_IDENTIFIER: com.barto95100.ora.tests
          CODE_SIGN_ENTITLEMENTS: Ombre/Info/Ombre-dev.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          ENABLE_HARDENED_RUNTIME: NO
          DEVELOPMENT_TEAM: Q76T6LDBBZ
        Release:
          # Signed with the same team as Debug. Distributing outside this Mac
          # needs a Developer ID certificate and notarization (paid program).
          CODE_SIGN_ENTITLEMENTS: Ombre/Info/Ombre.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: Q76T6LDBBZ
          ENABLE_HARDENED_RUNTIME: YES

  OmbreTests:
    type: bundle.unit-test
    platform: "macOS"
    deploymentTarget: "15.0"
    sources:
      - path: OmbreTests
    dependencies:
      - target: Ombre
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ombre.app/Contents/MacOS/Ombre"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # As the app's (see there).
        OMBRE_WARNINGS_AS_ERRORS: NO
        SWIFT_TREAT_WARNINGS_AS_ERRORS: $(OMBRE_WARNINGS_AS_ERRORS)
        GCC_TREAT_WARNINGS_AS_ERRORS: $(OMBRE_WARNINGS_AS_ERRORS)
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q76T6LDBBZ
      configs:
        # The app is "Ombre Dev" in Debug (see the app's settings).
        Debug:
          TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ombre Dev.app/Contents/MacOS/Ombre Dev"

schemes:
  Ombre:
    shared: true
    build:
      targets:
        Ombre: all
    run:
      config: Debug
    test:
      config: Test
      # The tests read English texts, whatever the Mac's language.
      language: en
      region: US
      targets:
        - OmbreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
