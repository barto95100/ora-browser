name: Ombre
options:
  bundleIdPrefix: com.barto95100

# "Test": the app the unit tests run in, built like Debug but with its own
# bundle identifier, so its preferences, files and Keychain items never mix
# with the Debug app's (see `TestHost`).
configs:
  Debug: debug
  Test: debug
  Release: release

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  Inject:
    url: https://github.com/krzysztofzablocki/Inject
    from: 1.5.2
  FaviconFinder:
    url: https://github.com/will-lumley/FavIconFinder
    exactVersion: 5.1.5
  SafariConverterLib:
    url: https://github.com/AdguardTeam/SafariConverterLib
    exactVersion: 4.2.2
  # Public Suffix List (already used by SafariConverterLib): which domains
  # belong to the same web site.
  swift-psl:
    url: https://github.com/ameshkov/swift-psl
    from: 1.1.0

targets:
  Ombre:
    type: application
    platform: "macOS"
    deploymentTarget: "15.0"
    sources:
      - path: Ombre
      # Shown in the Licenses window.
      - path: LICENSE
        buildPhase: resources
    resources:
      - path: Ombre/Shared/EmojiPicker/emoji-set.json
      - path: Ombre/Resources
        optional: true
    dependencies:
      - package: Sparkle
      - package: Inject
      - package: FaviconFinder
      - package: SafariConverterLib
        product: ContentBlockerConverter
      - package: swift-psl
        product: PublicSuffixList

    info:
      path: Ombre/Info/Info.plist
      properties:
        # Web pages may load over plain HTTP, like in any browser (WebKit then
        # marks them as not secure); the app's own requests keep App Transport
        # Security. Without it, every public http:// page failed (error -1022).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSCameraUsageDescription: "Allows websites to use the camera, for example during video calls."
        NSMicrophoneUsageDescription: "Allows websites to use the microphone, for example during calls or dictation."
        SUEnableAutomaticChecks: NO
        SUEnableInstallerLauncherService: YES
        CFBundleURLTypes:
          - CFBundleURLName: Ombre
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            CFBundleURLSchemes:
              - http
              - https
        CFBundleDocumentTypes:
          - CFBundleTypeName: Web URL
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.url
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.html
          - CFBundleTypeName: XHTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.xhtml
        NSUserActivityTypes:
          - NSUserActivityTypeBrowsingWeb
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.web-browser
        CFBundleDisplayName: Ombre

    settings:
      base:
        SWIFT_VERSION: 5.9
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 106
        PRODUCT_NAME: Ombre
        PRODUCT_BUNDLE_IDENTIFIER: com.barto95100.ora
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Icon Composer file: Ombre/Assets/Icons/Ombre.icon (light, dark, mono).
        ASSETCATALOG_COMPILER_APPICON_NAME: Ombre
        SUEnableAutomaticChecks: NO
        SUEnableInstallerLauncherService: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.barto95100.ora.dev
          CODE_SIGN_ENTITLEMENTS: Ombre/Info/Ombre-dev.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          EMIT_FRONTEND_COMMAND_LINES: YES
          OTHER_LDFLAGS: "-Xlinker -interposable"
          ENABLE_HARDENED_RUNTIME: NO
          DEVELOPMENT_TEAM: Q76T6LDBBZ
        Test:
          PRODUCT_BUNDLE_IDENTIFIER: com.barto95100.ora.tests
          CODE_SIGN_ENTITLEMENTS: Ombre/Info/Ombre-dev.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          ENABLE_HARDENED_RUNTIME: NO
          DEVELOPMENT_TEAM: Q76T6LDBBZ
        Release:
          # Signed with the same team as Debug. Distributing outside this Mac
          # needs a Developer ID certificate and notarization (paid program).
          CODE_SIGN_ENTITLEMENTS: Ombre/Info/Ombre.entitlements
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: Q76T6LDBBZ
          ENABLE_HARDENED_RUNTIME: YES

  OmbreTests:
    type: bundle.unit-test
    platform: "macOS"
    deploymentTarget: "15.0"
    sources:
      - path: OmbreTests
    dependencies:
      - target: Ombre
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ombre.app/Contents/MacOS/Ombre"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q76T6LDBBZ

schemes:
  Ombre:
    shared: true
    build:
      targets:
        Ombre: all
    run:
      config: Debug
    test:
      config: Test
      targets:
        - OmbreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
